<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>Smart Crop Advisory</title>
<style>
  :root {
    --green: #2e7d32;
    --green-light: #e8f5e9;
    --amber: #f57c00;
    --bg: #f4f7f4;
    --card: #ffffff;
    --text: #1b1b1b;
    --muted: #6b6b6b;
    --border: #dfe6df;
  }
  * { box-sizing: border-box; }
  body {
    margin: 0;
    font-family: -apple-system, "Segoe UI", Roboto, sans-serif;
    background: var(--bg);
    color: var(--text);
  }
  header {
    background: var(--green);
    color: white;
    padding: 20px 24px;
  }
  header h1 { margin: 0; font-size: 20px; }
  header p { margin: 4px 0 0; font-size: 13px; opacity: 0.9; }
  .wrap {
    max-width: 960px;
    margin: 24px auto;
    padding: 0 16px 40px;
    display: grid;
    grid-template-columns: 1fr 1fr;
    gap: 20px;
  }
  @media (max-width: 720px) { .wrap { grid-template-columns: 1fr; } }
  .card {
    background: var(--card);
    border: 1px solid var(--border);
    border-radius: 10px;
    padding: 20px;
  }
  .card h2 { margin-top: 0; font-size: 16px; }
  .field { margin-bottom: 12px; }
  label { display: block; font-size: 12px; color: var(--muted); margin-bottom: 4px; }
  input {
    width: 100%;
    padding: 8px 10px;
    border: 1px solid var(--border);
    border-radius: 6px;
    font-size: 14px;
  }
  .grid2 { display: grid; grid-template-columns: 1fr 1fr; gap: 10px; }
  button {
    background: var(--green);
    color: white;
    border: none;
    border-radius: 6px;
    padding: 10px 16px;
    font-size: 14px;
    cursor: pointer;
    margin-top: 8px;
  }
  button.secondary {
    background: white;
    color: var(--green);
    border: 1px solid var(--green);
  }
  button:hover { opacity: 0.9; }
  .result {
    margin-top: 16px;
    padding: 14px;
    border-radius: 8px;
    background: var(--green-light);
    display: none;
  }
  .result.show { display: block; }
  .result .crop { font-size: 22px; font-weight: 600; color: var(--green); text-transform: capitalize; }
  .result .conf { font-size: 13px; color: var(--muted); }
  .alt { font-size: 13px; margin-top: 8px; color: var(--text); }
  .advice {
    margin-top: 12px;
    padding: 10px 12px;
    border-radius: 6px;
    background: #fff3e0;
    border-left: 4px solid var(--amber);
    font-size: 13px;
  }
  .error { color: #c62828; font-size: 13px; margin-top: 10px; }
  .status { font-size: 12px; color: var(--muted); margin-top: 10px; }
  .dot { display: inline-block; width: 8px; height: 8px; border-radius: 50%; margin-right: 5px; }
  .dot.ok { background: #2e7d32; }
  .dot.bad { background: #c62828; }
</style>
</head>
<body>

<header>
  <h1>Smart Crop Advisory System</h1>
  <p>IoT + ML-based crop selection and irrigation recommendations</p>
</header>

<div class="wrap">

  <div class="card">
    <h2>Sensor input</h2>
    <div class="grid2">
      <div class="field"><label>Nitrogen (N)</label><input type="number" id="N" value="80"></div>
      <div class="field"><label>Phosphorus (P)</label><input type="number" id="P" value="45"></div>
      <div class="field"><label>Potassium (K)</label><input type="number" id="K" value="40"></div>
      <div class="field"><label>Temperature (°C)</label><input type="number" id="temperature" value="25"></div>
      <div class="field"><label>Humidity (%)</label><input type="number" id="humidity" value="70"></div>
      <div class="field"><label>Soil pH</label><input type="number" step="0.1" id="ph" value="6.5"></div>
      <div class="field"><label>Rainfall (mm)</label><input type="number" id="rainfall" value="150"></div>
      <div class="field"><label>Soil moisture (%)</label><input type="number" id="soil_moisture" value="45"></div>
    </div>
    <button onclick="pullSensorData()" class="secondary">Pull live IoT sensor reading</button>
    <button onclick="getRecommendation()">Get recommendation</button>
    <div class="status"><span id="statusDot" class="dot bad"></span><span id="statusText">Checking backend...</span></div>
  </div>

  <div class="card">
    <h2>Recommendation</h2>
    <div id="result" class="result">
      <div class="crop" id="cropName">—</div>
      <div class="conf" id="confText"></div>
      <div class="alt" id="altText"></div>
      <div class="advice" id="advice"></div>
    </div>
    <div id="placeholder" style="color: var(--muted); font-size: 14px;">
      Enter or pull sensor values, then click "Get recommendation".
    </div>
    <div id="errorBox" class="error"></div>
  </div>

</div>

<script>
const API_BASE = "http://localhost:5001/api";

async function checkHealth() {
  try {
    const res = await fetch(`${API_BASE}/health`);
    if (res.ok) {
      document.getElementById("statusDot").className = "dot ok";
      document.getElementById("statusText").textContent = "Backend connected";
    } else throw new Error();
  } catch {
    document.getElementById("statusDot").className = "dot bad";
    document.getElementById("statusText").textContent = "Backend not running (start backend/app.py)";
  }
}

async function pullSensorData() {
  try {
    const res = await fetch(`${API_BASE}/sensors`);
    const data = await res.json();
    for (const key of ["N", "P", "K", "temperature", "humidity", "ph", "rainfall", "soil_moisture"]) {
      document.getElementById(key).value = data[key];
    }
  } catch (e) {
    showError("Could not reach sensor endpoint. Is the backend running?");
  }
}

async function getRecommendation() {
  const errorBox = document.getElementById("errorBox");
  errorBox.textContent = "";
  const payload = {};
  for (const key of ["N", "P", "K", "temperature", "humidity", "ph", "rainfall", "soil_moisture"]) {
    payload[key] = document.getElementById(key).value;
  }

  try {
    const res = await fetch(`${API_BASE}/recommend`, {
      method: "POST",
      headers: { "Content-Type": "application/json" },
      body: JSON.stringify(payload),
    });
    const data = await res.json();
    if (!res.ok) { showError(data.error || "Something went wrong."); return; }

    document.getElementById("placeholder").style.display = "none";
    const result = document.getElementById("result");
    result.classList.add("show");
    document.getElementById("cropName").textContent = data.top_recommendation;
    document.getElementById("confText").textContent = `Confidence: ${data.confidence}%`;
    document.getElementById("altText").textContent = "Alternatives: " +
      data.alternatives.map(a => `${a.crop} (${a.confidence}%)`).join(", ");
    document.getElementById("advice").textContent = data.irrigation_advice;
  } catch (e) {
    showError("Could not reach the backend. Is backend/app.py running on port 5000?");
  }
}

function showError(msg) {
  document.getElementById("errorBox").textContent = msg;
}

checkHealth();
</script>

</body>
</html>
